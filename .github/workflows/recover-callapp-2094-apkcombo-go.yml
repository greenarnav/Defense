name: Recover CallApp 2.094 from APKCombo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-callapp-2094-apkcombo-go.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build current apkdgo
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/kiber-io/apkdgo.git /tmp/apkdgo
          cd /tmp/apkdgo
          go build -o "$GITHUB_WORKSPACE/apkd" ./cmd/apkd
          "$GITHUB_WORKSPACE/apkd" --version | tee "$GITHUB_WORKSPACE/apkd-version.txt" || true
          cd "$GITHUB_WORKSPACE"
          python -m pip install 'androguard==4.1.3' 'loguru>=0.7,<1'

      - name: Download exact version code 2094
        shell: bash
        run: |
          set +e
          mkdir -p out analysis
          ./apkd -vv -s apkcombo -p com.callapp.contacts:2094 -O out > out/apkd.log 2>&1
          RC=$?
          echo "exit=$RC" | tee analysis/apkcombo-go-status.txt
          find out -type f -printf '%p %s bytes\n' | sort | tee -a analysis/apkcombo-go-status.txt
          set -e

          python3 - <<'PY'
          from pathlib import Path
          from androguard.core.apk import APK
          import hashlib,json,zipfile
          expected_cert='5992ac7b1049f2e71d9c981ee0c5c3f92bcae7144c86ee26dd9f9d2b2531f2e5'
          expected_hash='047810e456e9ed921797a04d27dbc632fa51c301e38e9360712ae12110c1b525'
          rows=[]; accepted=None
          for p in Path('out').rglob('*'):
              if not p.is_file() or not zipfile.is_zipfile(p): continue
              try: apk=APK(str(p))
              except Exception as exc:
                  rows.append({'file':str(p),'error':str(exc)}); continue
              blobs=[]
              for name in ('get_certificates_der_v3','get_certificates_der_v2','get_certificates_der_v1'):
                  fn=getattr(apk,name,None)
                  if fn:
                      try: blobs.extend(list(fn() or []))
                      except Exception: pass
              certs=sorted({hashlib.sha256(bytes(x)).hexdigest() for x in blobs})
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              identity=apk.get_package()=='com.callapp.contacts' and str(apk.get_androidversion_name())=='2.094' and str(apk.get_androidversion_code())=='2094'
              row={'file':str(p),'size':p.stat().st_size,'sha256':sha,'certificate_sha256':certs,'package':apk.get_package(),'version_name':apk.get_androidversion_name(),'version_code':apk.get_androidversion_code(),'identity_match':identity,'exact_hash_match':sha==expected_hash,'official_signature_match':expected_cert in certs,'accepted':identity and (sha==expected_hash or expected_cert in certs)}
              rows.append(row)
              if row['accepted'] and accepted is None: accepted=p
          Path('analysis/apkcombo-go-verification.json').write_text(json.dumps(rows,indent=2)+'\n')
          if accepted:
              target=Path('out/CallApp-2.094-official.apk')
              if accepted != target: accepted.replace(target)
              Path('out/VERIFIED').write_text('accepted\n')
          print(json.dumps(rows,indent=2))
          PY

      - name: Upload verified APK privately
        if: ${{ hashFiles('out/VERIFIED') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: CallApp-2.094-official-apkcombo
          path: |
            out/CallApp-2.094-official.apk
            out/VERIFIED
            out/apkd.log
            analysis/apkcombo-go-verification.json
          retention-days: 7

      - name: Upload recovery logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CallApp-2.094-apkcombo-recovery
          path: |
            out/apkd.log
            analysis/apkcombo-go-status.txt
            analysis/apkcombo-go-verification.json
            apkd-version.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish result
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/apkcombo-go-status.txt analysis/apkcombo-go-verification.json || true
          git commit -m 'Record APKCombo CallApp 2.094 recovery result' || exit 0
          git push
