name: Strict CallApp 2.094 vs 2.280 reproduction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deep-callapp-privacy-reproduction-v2.yml'
      - 'tools/deep_privacy_audit.py.gz.b64'
      - 'tools/patch_deep_privacy_audit.py'

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      OLD_EXPECTED_CERT_SHA256: 5992ac7b1049f2e71d9c981ee0c5c3f92bcae7144c86ee26dd9f9d2b2531f2e5
      CURRENT_EXPECTED_XAPK_SHA256: 5efbc286c10d387d2d179a87a08ed1dbaff8598daeaeaa7857ff8d39da8d7da9
      CURRENT_EXPECTED_BASE_SHA256: 2c17e9da2ecf62e036841c17f0e6c28586ac6983419cf08d2b43a26a5a5fa316

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: tools
        name: Install and verify tools
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'androguard==4.1.3' 'loguru>=0.7,<1'
          mkdir -p tools downloads/old downloads/current logs work results analysis
          base64 -d tools/deep_privacy_audit.py.gz.b64 | gzip -dc > tools/deep_privacy_audit.py
          python tools/patch_deep_privacy_audit.py
          python -m py_compile tools/deep_privacy_audit.py

          curl -L --fail --retry 4 -o tools/apkeep \
            https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-x86_64-unknown-linux-gnu
          chmod +x tools/apkeep
          tools/apkeep --version | tee logs/apkeep-version.txt

          curl -L --fail --retry 4 -o tools/jadx.zip \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -q tools/jadx.zip -d tools/jadx
          tools/jadx/bin/jadx --version | tee logs/jadx-version.txt

          curl -L --fail --retry 4 -o tools/Priv_impl.json \
            https://raw.githubusercontent.com/1phan/PICOSCAN/main/data/privacy-apis/Priv_impl.json
          sha256sum tools/Priv_impl.json | tee logs/pico-metadb-sha256.txt

      - id: old
        name: Recover and authenticate CallApp 2.094
        shell: bash
        run: |
          set -euxo pipefail
          UA='Appteka/22.1 (Android 14; research-reproduction)'
          BASE='https://appteka.store/api/1/app/info'
          APP_ID='955r139916'
          COMMON=(
            -H "User-Agent: $UA"
            -H 'X-Device-ID: 00000000-0000-4000-8000-000000000001'
            -H 'X-App-Package: com.tomclaw.appsend'
            -H 'X-App-Version-Name: 22.1'
            -H 'X-App-Version-Code: 1095'
            -H 'X-App-Signature: research'
            -H 'X-Android-Version: 34'
            -H 'X-Android-Release: 14'
            -H 'X-Device-Manufacturer: Google'
            -H 'X-Device-Model: Pixel 6'
            -H 'X-Locale: en-US'
            -H 'X-Theme: light'
            -H 'X-Timezone: UTC'
            -H 'X-Local-Time: 2026-08-19T01:00:00Z'
            -H 'Accept: application/json'
          )
          curl -L --fail-with-body --retry 4 "${COMMON[@]}" --get "$BASE" \
            --data-urlencode "app_id=$APP_ID" --data-urlencode 'locale=en' \
            -o downloads/old/info.json

          python3 - <<'PY'
          from pathlib import Path
          import json, urllib.parse
          obj=json.loads(Path('downloads/old/info.json').read_text())
          result=obj.get('result') or {}; info=result.get('info') or {}
          values=[]
          for key in ('link','url','download_url','file_url'):
              value=result.get(key)
              if isinstance(value,str) and value.strip():
                  values.append((key,urllib.parse.urljoin('https://appteka.store/',value)))
          if not values: raise SystemExit('No Appteka APK link')
          Path('downloads/old/url.txt').write_text(values[0][1])
          meta={
              'source':'Appteka public API','app_id':info.get('app_id') or '955r139916',
              'package':info.get('package'),'version_name':info.get('ver_name') or info.get('version_name'),
              'version_code':info.get('ver_code') or info.get('version_code'),'sha1':info.get('sha1'),
              'size':info.get('size'),'download_field':values[0][0],
          }
          Path('logs/old-appteka-metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY
          curl -L --fail-with-body --retry 4 -A "$UA" \
            "$(cat downloads/old/url.txt)" -o downloads/old/CallApp-2.094.apk
          unzip -t downloads/old/CallApp-2.094.apk > logs/old-unzip-test.txt

          python3 - <<'PY'
          from pathlib import Path
          from androguard.core.apk import APK
          import hashlib,json,os
          p=Path('downloads/old/CallApp-2.094.apk')
          apk=APK(str(p))
          blobs=[]
          for name in ('get_certificates_der_v3','get_certificates_der_v2','get_certificates_der_v1'):
              fn=getattr(apk,name,None)
              if fn:
                  try: blobs.extend(list(fn() or []))
                  except Exception: pass
          certs=sorted({hashlib.sha256(bytes(x)).hexdigest() for x in blobs})
          result={
              'package':apk.get_package(),'version_name':apk.get_androidversion_name(),
              'version_code':apk.get_androidversion_code(),'apk_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'certificate_sha256':certs,'expected_certificate_sha256':os.environ['OLD_EXPECTED_CERT_SHA256'],
          }
          result['identity_match']=result['package']=='com.callapp.contacts' and str(result['version_name'])=='2.094' and str(result['version_code'])=='2094'
          result['official_signature_match']=os.environ['OLD_EXPECTED_CERT_SHA256'] in certs
          result['accepted']=result['identity_match'] and result['official_signature_match']
          Path('logs/old-authentication.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if not result['accepted']: raise SystemExit('Old APK identity/signature authentication failed')
          PY
          sha256sum downloads/old/CallApp-2.094.apk | tee logs/old-sha256.txt

      - id: current
        name: Download and authenticate CallApp 2.280
        shell: bash
        run: |
          set -euxo pipefail
          tools/apkeep -a com.callapp.contacts@2.280 -d apk-pure downloads/current 2>&1 | tee logs/current-download.txt
          FOUND="$(find downloads/current -type f \( -name '*.xapk' -o -name '*.apk' \) | head -1)"
          test -n "$FOUND"
          cp "$FOUND" downloads/current/CallApp-2.280.xapk
          test "$(sha256sum downloads/current/CallApp-2.280.xapk | awk '{print $1}')" = "$CURRENT_EXPECTED_XAPK_SHA256"

          python3 - <<'PY'
          from pathlib import Path
          import shutil,zipfile
          bundle=Path('downloads/current/CallApp-2.280.xapk')
          if bundle.suffix.lower()=='.apk':
              shutil.copy2(bundle,'downloads/current/CallApp-2.280-base.apk')
          else:
              with zipfile.ZipFile(bundle) as z:
                  apks=[i for i in z.infolist() if not i.is_dir() and i.filename.lower().endswith('.apk')]
                  def score(i):
                      b=Path(i.filename.lower()).name; s=i.file_size/1e6
                      if b=='base.apk': s+=2000
                      if b=='com.callapp.contacts.apk': s+=1900
                      if 'base-master' in b: s+=1700
                      if b.startswith('base-'): s+=1400
                      if any(x in b for x in ('config.','config_','split_config','dpi','arm64','armeabi','x86')): s-=1800
                      return s
                  chosen=max(apks,key=score)
                  with z.open(chosen) as src, open('downloads/current/CallApp-2.280-base.apk','wb') as dst:
                      shutil.copyfileobj(src,dst)
                  Path('logs/current-selected-base.txt').write_text(f'{chosen.filename}\n{chosen.file_size}\n')
          PY
          unzip -t downloads/current/CallApp-2.280-base.apk > logs/current-base-unzip-test.txt
          test "$(sha256sum downloads/current/CallApp-2.280-base.apk | awk '{print $1}')" = "$CURRENT_EXPECTED_BASE_SHA256"
          sha256sum downloads/current/CallApp-2.280.xapk downloads/current/CallApp-2.280-base.apk | tee logs/current-sha256.txt

      - id: jadx
        name: Decompile both authenticated releases
        shell: bash
        run: |
          set +e
          mkdir -p work/old work/current
          tools/jadx/bin/jadx --deobf --show-bad-code --threads-count 4 -d work/old \
            downloads/old/CallApp-2.094.apk > logs/jadx-old.txt 2>&1
          OLD_RC=$?
          tools/jadx/bin/jadx --deobf --show-bad-code --threads-count 4 -d work/current \
            downloads/current/CallApp-2.280-base.apk > logs/jadx-current.txt 2>&1
          CURRENT_RC=$?
          set -e
          printf 'old_rc=%s\ncurrent_rc=%s\n' "$OLD_RC" "$CURRENT_RC" | tee logs/jadx-return-codes.txt
          OLD_COUNT="$(find work/old/sources -name '*.java' | wc -l)"
          CURRENT_COUNT="$(find work/current/sources -name '*.java' | wc -l)"
          printf 'old_java=%s\ncurrent_java=%s\n' "$OLD_COUNT" "$CURRENT_COUNT" | tee logs/jadx-source-counts.txt
          test "$OLD_COUNT" -gt 100
          test "$CURRENT_COUNT" -gt 100

      - id: audit
        name: Build source and DEX cross-reference proof
        shell: bash
        run: |
          set -euxo pipefail
          cat > config.json <<'JSON'
          {
            "samples": [
              {"label":"old_2.094","apk":"downloads/old/CallApp-2.094.apk","source_root":"work/old/sources"},
              {"label":"current_2.280","apk":"downloads/current/CallApp-2.280-base.apk","source_root":"work/current/sources"}
            ]
          }
          JSON
          python tools/deep_privacy_audit.py --config config.json --pico-meta tools/Priv_impl.json --output results \
            2>&1 | tee logs/deep-audit.txt
          cp results/comparison.json analysis/callapp-2.094-vs-2.280-strict-comparison.json
          cp results/comparison.md analysis/callapp-2.094-vs-2.280-strict-comparison.md
          find results logs -type f -exec sha256sum {} + | sort > results/artifact-sha256.txt

      - name: Upload complete proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CallApp-2.094-vs-2.280-strict-reproduction
          path: |
            results
            logs
            analysis/callapp-2.094-vs-2.280-strict-comparison.json
            analysis/callapp-2.094-vs-2.280-strict-comparison.md
            tools/deep_privacy_audit.py
            tools/Priv_impl.json
            config.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish success or failure status
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "checked_at_utc=$(date -u +%FT%TZ)"
            echo "tools=${{ steps.tools.outcome }}"
            echo "old=${{ steps.old.outcome }}"
            echo "current=${{ steps.current.outcome }}"
            echo "jadx=${{ steps.jadx.outcome }}"
            echo "audit=${{ steps.audit.outcome }}"
          } > analysis/strict-run-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/strict-run-status.txt
          if [ -f analysis/callapp-2.094-vs-2.280-strict-comparison.json ]; then
            git add analysis/callapp-2.094-vs-2.280-strict-comparison.json analysis/callapp-2.094-vs-2.280-strict-comparison.md
          fi
          git commit -m 'Publish strict CallApp reproduction result' || exit 0
          git push
