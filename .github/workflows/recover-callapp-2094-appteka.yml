name: Recover exact CallApp 2.094 from Appteka

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-callapp-2094-appteka.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install certificate parser
        run: python -m pip install 'androguard==4.1.3' 'loguru>=0.7,<1'

      - name: Query, download, and verify target release
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out analysis
          UA='Appteka/22.1 (Android 14; research-reproduction)'
          BASE='https://appteka.store/api/1/app/info'
          APP_ID='955r139916'
          COMMON=(
            -H "User-Agent: $UA"
            -H 'X-Device-ID: 00000000-0000-4000-8000-000000000001'
            -H 'X-App-Package: com.tomclaw.appsend'
            -H 'X-App-Version-Name: 22.1'
            -H 'X-App-Version-Code: 1095'
            -H 'X-App-Signature: research'
            -H 'X-Android-Version: 34'
            -H 'X-Android-Release: 14'
            -H 'X-Device-Manufacturer: Google'
            -H 'X-Device-Model: Pixel 6'
            -H 'X-Locale: en-US'
            -H 'X-Theme: light'
            -H 'X-Timezone: UTC'
            -H 'X-Local-Time: 2026-08-19T01:00:00Z'
            -H 'Accept: application/json'
          )
          curl -L --fail-with-body --retry 4 "${COMMON[@]}" \
            --get "$BASE" --data-urlencode "app_id=$APP_ID" --data-urlencode 'locale=en' \
            -D out/info-headers.txt -o out/info.json

          python3 - <<'PY'
          from pathlib import Path
          import json, urllib.parse
          obj=json.loads(Path('out/info.json').read_text())
          result=obj.get('result') or {}; info=result.get('info') or {}
          candidates=[]
          for key in ('link','url','download_url','file_url'):
              value=result.get(key)
              if isinstance(value,str) and value.strip():
                  candidates.append({'field':key,'url':urllib.parse.urljoin('https://appteka.store/',value)})
          meta={
              'status':obj.get('status'),'app_id':info.get('app_id') or '955r139916',
              'package':info.get('package'),'version_name':info.get('ver_name') or info.get('version_name'),
              'version_code':info.get('ver_code') or info.get('version_code'),'size':info.get('size'),
              'sha1':info.get('sha1'),'expires_in':result.get('expires_in'),
              'candidate_fields':[c['field'] for c in candidates],
              'candidate_hosts':[urllib.parse.urlparse(c['url']).netloc for c in candidates],
          }
          Path('analysis/appteka-2094-metadata.json').write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n')
          Path('out/download-candidates.json').write_text(json.dumps(candidates,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY

          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          candidates=json.loads(Path('out/download-candidates.json').read_text())
          for i,c in enumerate(candidates):
              out=f'out/candidate-{i}-{c["field"]}.bin'
              rc=subprocess.call(['curl','-L','--fail-with-body','--retry','4','-A','Appteka/22.1 (Android 14; research-reproduction)',c['url'],'-o',out])
              print('candidate',i,c['field'],'rc',rc,'size',Path(out).stat().st_size if Path(out).exists() else 0)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          from androguard.core.apk import APK

          expected='047810e456e9ed921797a04d27dbc632fa51c301e38e9360712ae12110c1b525'
          expected_cert='5992ac7b1049f2e71d9c981ee0c5c3f92bcae7144c86ee26dd9f9d2b2531f2e5'
          rows=[]; accepted=None
          for p in sorted(Path('out').glob('candidate-*.bin')):
              data=p.read_bytes(); sha=hashlib.sha256(data).hexdigest(); is_zip=zipfile.is_zipfile(p)
              has_manifest=False; package=None; version_name=None; version_code=None; certs=[]; parse_error=None
              if is_zip:
                  try:
                      with zipfile.ZipFile(p) as z: has_manifest='AndroidManifest.xml' in z.namelist()
                  except Exception as exc: parse_error=f'zip: {exc}'
              if is_zip and has_manifest:
                  try:
                      apk=APK(str(p))
                      package=apk.get_package(); version_name=apk.get_androidversion_name(); version_code=apk.get_androidversion_code()
                      blobs=[]
                      for name in ('get_certificates_der_v3','get_certificates_der_v2','get_certificates_der_v1'):
                          fn=getattr(apk,name,None)
                          if fn:
                              try: blobs.extend(list(fn() or []))
                              except Exception: pass
                      certs=sorted({hashlib.sha256(bytes(blob)).hexdigest() for blob in blobs})
                  except Exception as exc: parse_error=f'androguard: {exc}'
              exact=sha==expected; cert_ok=expected_cert in certs
              identity_ok=package=='com.callapp.contacts' and str(version_name)=='2.094' and str(version_code)=='2094'
              row={
                  'file':p.name,'size_bytes':len(data),'sha256':sha,'zip':is_zip,'android_manifest':has_manifest,
                  'package':package,'version_name':version_name,'version_code':version_code,
                  'certificate_sha256':certs,'exact_hash_match':exact,'official_signature_match':cert_ok,
                  'identity_match':identity_ok,'parse_error':parse_error,
                  'accepted':is_zip and has_manifest and identity_ok and (exact or cert_ok),
              }
              rows.append(row)
              if row['accepted'] and accepted is None: accepted=p
          Path('analysis/appteka-2094-download-verification.json').write_text(json.dumps(rows,indent=2)+'\n')
          if accepted:
              target=Path('out/CallApp-2.094-2094-verified.apk'); accepted.replace(target); Path('out/VERIFIED').write_text('accepted\n')
          print(json.dumps(rows,indent=2))
          PY

          if [ -f out/CallApp-2.094-2094-verified.apk ]; then
            sha256sum out/CallApp-2.094-2094-verified.apk > out/sha256.txt
          fi

      - name: Upload verified positive control
        if: ${{ hashFiles('out/VERIFIED') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: CallApp-2.094-2094-verified
          path: |
            out/CallApp-2.094-2094-verified.apk
            out/sha256.txt
            out/info.json
            analysis/appteka-2094-metadata.json
            analysis/appteka-2094-download-verification.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish verification metadata
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/appteka-2094-metadata.json analysis/appteka-2094-download-verification.json
          git commit -m 'Authenticate exact CallApp 2.094 positive control' || exit 0
          git push
