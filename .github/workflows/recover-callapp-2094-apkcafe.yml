name: Recover CallApp 2.094 from APK Cafe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-callapp-2094-apkcafe.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download archived APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          URL='https://apk.cafe/download?file_id=2620707%2Fcaller-id-and-block'
          curl -L --fail --retry 5 --retry-all-errors \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
            -H 'Referer: https://caller-id-and-block.apk.cafe/' \
            "$URL" -o out/callapp-2.094.apk
          file out/callapp-2.094.apk | tee out/file.txt
          stat -c '%n %s bytes' out/callapp-2.094.apk | tee out/size.txt
          sha256sum out/callapp-2.094.apk | tee out/sha256.txt
          unzip -t out/callapp-2.094.apk > out/unzip-test.txt
          EXPECTED='047810e456e9ed921797a04d27dbc632fa51c301e38e9360712ae12110c1b525'
          ACTUAL="$(sha256sum out/callapp-2.094.apk | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload verified APK privately as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: callapp-2.094-verified
          path: out
          if-no-files-found: error
          retention-days: 7
